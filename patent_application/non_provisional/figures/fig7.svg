<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1050" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow7" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#000"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="1050" fill="#ffffff"/>
  <text x="850" y="30" font-size="14" text-anchor="end" fill="#000">7/7</text>

  <!-- 705 center topic node -->
  <rect x="325" y="45" width="250" height="50" fill="none" stroke="#000" stroke-width="2"/>
  <text x="450" y="75" font-size="15" text-anchor="middle" font-weight="bold">Center topic node (705)</text>
  <line x1="450" y1="95" x2="450" y2="135" stroke="#000" stroke-width="2" marker-end="url(#arrow7)"/>

  <!-- 700 neighborhood display module -->
  <rect x="225" y="135" width="450" height="60" rx="10" fill="none" stroke="#000" stroke-width="2"/>
  <text x="450" y="160" font-size="14" text-anchor="middle" font-weight="bold">Neighborhood-Display module (700)</text>
  <text x="450" y="178" font-size="11" text-anchor="middle">queries direct neighbors via prerequisite (232) and</text>
  <line x1="450" y1="195" x2="450" y2="235" stroke="#000" stroke-width="2" marker-end="url(#arrow7)"/>
  <text x="465" y="215" font-size="11">typed structural (234) relationships, either direction</text>

  <!-- 710 mastery-state coloring module -->
  <rect x="225" y="235" width="450" height="55" rx="10" fill="none" stroke="#000" stroke-width="2"/>
  <text x="450" y="260" font-size="14" text-anchor="middle" font-weight="bold">Mastery-State Coloring module (710)</text>
  <text x="450" y="278" font-size="10" text-anchor="middle">assigns a visual state to each displayed neighbor</text>
  <line x1="450" y1="290" x2="450" y2="320" stroke="#000" stroke-width="2" marker-end="url(#arrow7)"/>

  <!-- four state boxes -->
  <rect x="60"  y="320" width="180" height="45" fill="none" stroke="#000" stroke-width="2"/>
  <text x="150" y="348" font-size="12" text-anchor="middle">Mastered (720)</text>

  <rect x="255" y="320" width="180" height="45" fill="none" stroke="#000" stroke-width="2"/>
  <text x="345" y="341" font-size="12" text-anchor="middle">Recommended</text>
  <text x="345" y="356" font-size="12" text-anchor="middle">next (722)</text>

  <rect x="450" y="320" width="180" height="45" fill="none" stroke="#000" stroke-width="2"/>
  <text x="540" y="348" font-size="12" text-anchor="middle">Ready (724)</text>

  <rect x="645" y="320" width="195" height="45" fill="none" stroke="#000" stroke-width="2"/>
  <text x="742" y="341" font-size="12" text-anchor="middle">Not yet ready</text>
  <text x="742" y="356" font-size="12" text-anchor="middle">(726)</text>

  <line x1="450" y1="365" x2="450" y2="405" stroke="#000" stroke-width="2" marker-end="url(#arrow7)"/>

  <!-- 730 importance ranked filtering module -->
  <rect x="225" y="405" width="450" height="60" rx="10" fill="none" stroke="#000" stroke-width="2"/>
  <text x="450" y="430" font-size="14" text-anchor="middle" font-weight="bold">Importance-Ranked Filtering module (730)</text>
  <text x="450" y="448" font-size="10" text-anchor="middle">keeps top-K neighbors by importance; renders rank indicator</text>
  <line x1="450" y1="465" x2="450" y2="505" stroke="#000" stroke-width="2" marker-end="url(#arrow7)"/>

  <!-- rendered graph view -->
  <rect x="300" y="505" width="300" height="50" fill="none" stroke="#000" stroke-width="2"/>
  <text x="450" y="535" font-size="14" text-anchor="middle" font-weight="bold">Rendered graph view</text>

  <!-- branch to 735 -->
  <line x1="300" y1="530" x2="120" y2="610" stroke="#000" stroke-width="2" marker-end="url(#arrow7)"/>
  <text x="160" y="580" font-size="11">hover / tap</text>
  <text x="160" y="595" font-size="11">relationship</text>

  <rect x="30" y="610" width="270" height="65" rx="10" fill="none" stroke="#000" stroke-width="2"/>
  <text x="165" y="635" font-size="13" text-anchor="middle" font-weight="bold">Relationship-Description</text>
  <text x="165" y="651" font-size="13" text-anchor="middle" font-weight="bold">Interaction module (735)</text>
  <text x="165" y="667" font-size="10" text-anchor="middle">presents natural-language description</text>

  <!-- branch to 740 -->
  <line x1="600" y1="530" x2="770" y2="610" stroke="#000" stroke-width="2" marker-end="url(#arrow7)"/>
  <text x="700" y="580" font-size="11">select neighboring</text>
  <text x="700" y="595" font-size="11">topic node</text>

  <rect x="620" y="610" width="270" height="65" rx="10" fill="none" stroke="#000" stroke-width="2"/>
  <text x="755" y="635" font-size="13" text-anchor="middle" font-weight="bold">Re-Centering Navigation</text>
  <text x="755" y="651" font-size="13" text-anchor="middle" font-weight="bold">module (740)</text>
  <text x="755" y="667" font-size="10" text-anchor="middle">selected node becomes new center (705)</text>

  <!-- loop back to 705 -->
  <path d="M 755,675 C 755,780 450,850 450,95" fill="none" stroke="#000" stroke-width="1.5" marker-end="url(#arrow7)"/>
  <text x="620" y="800" font-size="11" text-anchor="middle">repeat for new center topic node</text>

  <text x="450" y="1010" font-size="16" text-anchor="middle" font-weight="bold">FIG. 7</text>
</svg>
