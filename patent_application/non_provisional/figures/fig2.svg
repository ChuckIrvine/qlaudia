<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 750" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#000"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="850" height="750" fill="#ffffff"/>
  <text x="800" y="30" font-size="14" text-anchor="end" fill="#000">2/7</text>

  <!-- Domain node 200 -->
  <rect x="300" y="50" width="250" height="110" fill="none" stroke="#000" stroke-width="2"/>
  <text x="425" y="72" font-size="16" text-anchor="middle" font-weight="bold">Domain node</text>
  <text x="425" y="92" font-size="12" text-anchor="middle">name, tagline, tagline_embedding,</text>
  <text x="425" y="108" font-size="12" text-anchor="middle">category, target_audience,</text>
  <text x="425" y="124" font-size="12" text-anchor="middle">coverage_overview, desired_outcome,</text>
  <text x="425" y="140" font-size="12" text-anchor="middle">tone_and_style</text>
  <line x1="270" y1="105" x2="300" y2="105" stroke="#000" stroke-width="1.5"/>
  <text x="265" y="110" font-size="15" text-anchor="end">200</text>

  <!-- CONTAINS edge 230 -->
  <line x1="425" y1="160" x2="425" y2="250" stroke="#000" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="440" y="210" font-size="13">CONTAINS (230)</text>

  <!-- Topic node A 210 -->
  <rect x="90" y="250" width="260" height="120" fill="none" stroke="#000" stroke-width="2"/>
  <text x="220" y="272" font-size="16" text-anchor="middle" font-weight="bold">Topic node</text>
  <text x="220" y="292" font-size="12" text-anchor="middle">name, study_content,</text>
  <text x="220" y="308" font-size="12" text-anchor="middle">content_embedding,</text>
  <text x="220" y="324" font-size="12" text-anchor="middle">importance_score</text>
  <line x1="60" y1="310" x2="90" y2="310" stroke="#000" stroke-width="1.5"/>
  <text x="55" y="315" font-size="15" text-anchor="end">210</text>

  <!-- Topic node B 211 -->
  <rect x="500" y="250" width="260" height="120" fill="none" stroke="#000" stroke-width="2"/>
  <text x="630" y="272" font-size="16" text-anchor="middle" font-weight="bold">Topic node</text>
  <text x="630" y="292" font-size="12" text-anchor="middle">name, study_content,</text>
  <text x="630" y="308" font-size="12" text-anchor="middle">content_embedding,</text>
  <text x="630" y="324" font-size="12" text-anchor="middle">importance_score</text>
  <line x1="470" y1="310" x2="500" y2="310" stroke="#000" stroke-width="1.5"/>
  <text x="465" y="315" font-size="15" text-anchor="end">211</text>

  <!-- PREREQUISITE_FOR edge 232, A -> B, upper path -->
  <path d="M 350,290 C 420,270 430,270 500,290" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="425" y="265" font-size="12" text-anchor="middle">PREREQUISITE_FOR (232)</text>

  <!-- HAS_RELATIONSHIP edge 234, B -> A, lower path -->
  <path d="M 500,340 C 430,365 420,365 350,340" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="425" y="382" font-size="12" text-anchor="middle">HAS_RELATIONSHIP (234)</text>
  <text x="425" y="397" font-size="10" text-anchor="middle">(label, archetype, description)</text>

  <!-- HAS_ASSESSMENT edge 236, Topic A -> Assessment -->
  <line x1="220" y1="370" x2="220" y2="450" stroke="#000" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="235" y="415" font-size="13">HAS_ASSESSMENT (236)</text>

  <!-- Assessment node 220 -->
  <rect x="90" y="450" width="260" height="90" fill="none" stroke="#000" stroke-width="2"/>
  <text x="220" y="472" font-size="16" text-anchor="middle" font-weight="bold">Assessment node</text>
  <text x="220" y="492" font-size="12" text-anchor="middle">question, options,</text>
  <text x="220" y="508" font-size="12" text-anchor="middle">explanation</text>
  <line x1="60" y1="495" x2="90" y2="495" stroke="#000" stroke-width="1.5"/>
  <text x="55" y="500" font-size="15" text-anchor="end">220</text>

  <text x="425" y="600" font-size="16" text-anchor="middle" font-weight="bold">FIG. 2</text>
</svg>
