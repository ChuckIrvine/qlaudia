<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 800" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow5" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#000"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="850" height="800" fill="#ffffff"/>
  <text x="800" y="30" font-size="14" text-anchor="end" fill="#000">5/7</text>

  <!-- 500 query -->
  <rect x="325" y="50" width="200" height="50" fill="none" stroke="#000" stroke-width="2"/>
  <text x="425" y="80" font-size="14" text-anchor="middle">Search query (500)</text>
  <line x1="425" y1="100" x2="425" y2="140" stroke="#000" stroke-width="2" marker-end="url(#arrow5)"/>

  <!-- 510 query embedding generator -->
  <rect x="275" y="140" width="300" height="60" rx="10" fill="none" stroke="#000" stroke-width="2"/>
  <text x="425" y="175" font-size="14" text-anchor="middle" font-weight="bold">Query-embedding generator (510)</text>

  <!-- branch -->
  <line x1="425" y1="200" x2="425" y2="230" stroke="#000" stroke-width="2"/>
  <line x1="425" y1="230" x2="180" y2="270" stroke="#000" stroke-width="2" marker-end="url(#arrow5)"/>
  <line x1="425" y1="230" x2="670" y2="270" stroke="#000" stroke-width="2" marker-end="url(#arrow5)"/>
  <text x="230" y="230" font-size="12">domain mode</text>
  <text x="580" y="230" font-size="12">concept mode</text>

  <!-- left branch: domain search -->
  <rect x="60" y="270" width="240" height="60" rx="10" fill="none" stroke="#000" stroke-width="2"/>
  <text x="180" y="295" font-size="13" text-anchor="middle" font-weight="bold">Domain comparator (520)</text>
  <text x="180" y="313" font-size="10" text-anchor="middle">vs. domain tagline embeddings</text>
  <line x1="180" y1="330" x2="180" y2="370" stroke="#000" stroke-width="2" marker-end="url(#arrow5)"/>

  <rect x="60" y="370" width="240" height="55" fill="none" stroke="#000" stroke-width="2"/>
  <text x="180" y="393" font-size="12" text-anchor="middle" font-weight="bold">Threshold filter 1 (522)</text>
  <text x="180" y="410" font-size="10" text-anchor="middle">similarity &gt;= threshold 1</text>

  <!-- right branch: concept search -->
  <rect x="550" y="270" width="240" height="60" rx="10" fill="none" stroke="#000" stroke-width="2"/>
  <text x="670" y="295" font-size="13" text-anchor="middle" font-weight="bold">Concept comparator (530)</text>
  <text x="670" y="313" font-size="10" text-anchor="middle">vs. topic content embeddings</text>
  <line x1="670" y1="330" x2="670" y2="370" stroke="#000" stroke-width="2" marker-end="url(#arrow5)"/>

  <rect x="550" y="370" width="240" height="60" rx="10" fill="none" stroke="#000" stroke-width="2"/>
  <text x="670" y="395" font-size="13" text-anchor="middle" font-weight="bold">Reranker (532)</text>
  <text x="670" y="413" font-size="10" text-anchor="middle">jointly scores query + content</text>
  <line x1="670" y1="430" x2="670" y2="470" stroke="#000" stroke-width="2" marker-end="url(#arrow5)"/>

  <rect x="550" y="470" width="240" height="55" fill="none" stroke="#000" stroke-width="2"/>
  <text x="670" y="493" font-size="12" text-anchor="middle" font-weight="bold">Threshold filter 2 (534)</text>
  <text x="670" y="510" font-size="10" text-anchor="middle">relevance &gt;= threshold 2</text>

  <!-- merge into 540 -->
  <line x1="180" y1="425" x2="180" y2="600" stroke="#000" stroke-width="2"/>
  <line x1="670" y1="525" x2="670" y2="600" stroke="#000" stroke-width="2"/>
  <line x1="180" y1="600" x2="400" y2="640" stroke="#000" stroke-width="2" marker-end="url(#arrow5)"/>
  <line x1="670" y1="600" x2="450" y2="640" stroke="#000" stroke-width="2" marker-end="url(#arrow5)"/>

  <rect x="300" y="640" width="250" height="55" fill="none" stroke="#000" stroke-width="2"/>
  <text x="425" y="663" font-size="13" text-anchor="middle" font-weight="bold">Filtered candidate nodes</text>
  <text x="425" y="680" font-size="11" text-anchor="middle">returned in response (540)</text>

  <text x="425" y="760" font-size="16" text-anchor="middle" font-weight="bold">FIG. 5</text>
</svg>
